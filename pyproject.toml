[project]
name = "rainfall-ca"
version = "0.1.0"
description = "GPU-accelerated 2D cellular-automata mountain rainfall demonstrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cupy-cuda13x>=13.6,<14",
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
gis = [
  "fiona>=1.10,<2",
  "rasterio>=1.4,<2",
]
dev = [
  "httpx>=0.28,<1",
  "markdown-it-py>=4,<5",
  "matplotlib>=3.10,<4",
  "playwright>=1.54,<2",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
